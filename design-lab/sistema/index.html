<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trajet · sistema «Cristal» · muestrario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Muestrario del sistema de diseño «Cristal» (FASE 2A).
   Lee ../tokens.json (generado por tools/tokens.mjs) y pinta cada componente
   con los tokens CORREGIDOS, en claro/oscuro, con «Aumentar contraste» y con
   «Reducir transparencia». Parámetros: ?theme=dark|light &hc=1 &rt=1 &rm=1.
   Es una referencia para la FASE 3, no una pantalla de la app. */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
.num, .badge, .via b { font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
main { max-width: 760px; margin: 0 auto; padding: 20px 14px 60px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
header.top h1 { font-size: 1.4rem; font-weight: 800; }
header.top p { font-size: .8rem; color: var(--ink3); }
section { margin: 26px 0; }
section > h2 { font-size: .78rem; font-weight: 600; color: var(--ink3); margin: 0 14px 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }

/* ---- paleta ---- */
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sw div { border-radius: 14px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--rule); font-size: .72rem; color: var(--ink2); }
.sw i { display: block; height: 34px; border-radius: 9px; margin-bottom: 6px; border: 1px solid var(--rule); background-image: linear-gradient(45deg, #8884 25%, transparent 25%, transparent 75%, #8884 75%), linear-gradient(45deg, #8884 25%, transparent 25%, transparent 75%, #8884 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; position: relative; overflow: hidden; }
.sw i::after { content: ""; position: absolute; inset: 0; background: var(--c); }
.sw b { display: block; color: var(--ink); font-weight: 600; }

/* ---- superficies ---- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 30px; padding: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); }
.hc .card { border-width: 1.5px; }
.glass { background: var(--glass); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); border: 1px solid var(--glassEdge); box-shadow: inset 0 1px 0 var(--glassHighlight), 0 10px 30px rgb(0 0 0 / .18); }
.rt .glass { background: var(--glassOpaque); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
.hc .glass { border-width: 1.5px; }
.map { position: relative; border-radius: 30px; overflow: hidden; padding: 12px; background:
  radial-gradient(60% 50% at 20% 30%, #cec73d66, transparent 70%), radial-gradient(50% 60% at 80% 60%, #64008266, transparent 70%),
  repeating-linear-gradient(35deg, var(--mapA) 0 22px, var(--mapB) 22px 24px), var(--mapA); }
.leg-head { display: flex; align-items: center; gap: 12px; margin: 2px 2px 10px; }
.leg-head h3 { font-size: 1.0625rem; font-weight: 700; line-height: 1.2; }
.leg-head h3 i { font-style: normal; color: var(--ink3); }
.leg-head p { font-size: .8125rem; color: var(--ink3); }

/* ---- distintivo ---- */
.badge { display: inline-grid; place-items: center; min-width: var(--s, 42px); height: var(--s, 42px); padding: 0 calc(var(--s, 42px) * .2); border-radius: calc(var(--s, 42px) * .3); background: var(--lc); color: var(--li); font-size: calc(var(--s, 42px) * .5); font-weight: 900; box-shadow: inset 0 -2px 0 rgb(0 0 0 / .15); }
.badge.l3 { font-size: calc(var(--s, 42px) * .44); } .badge.l4 { font-size: calc(var(--s, 42px) * .38); }
.hc .badge { outline: 1px solid var(--rule); outline-offset: -1px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.badges figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .62rem; color: var(--ink3); text-align: center; }
.badges figure.off small { color: var(--warnText); font-weight: 700; }

/* ---- billete ---- */
.ticket { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--ticket); color: var(--ticketInk); }
.ticket.atstop { background: var(--ok); color: var(--atStopInk); }
.ticket + .ticket, .card .ticket { margin-top: 10px; }
.tk-num { display: flex; align-items: baseline; gap: 4px; min-width: 2.2em; }
.tk-num .num { font-size: 3.5rem; }
.tk-num .num.long { font-size: 2.625rem; }
.tk-num .num.word { font-size: 1.75rem; white-space: nowrap; }
.tk-num small { font-size: .8125rem; font-weight: 800; color: var(--ticketInk2); font-family: ui-rounded, Nunito, system-ui; }
.atstop .tk-num small { color: var(--atStopInk); }
.tk-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tk-dest { font-weight: 700; font-size: 1.0625rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tk-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .8125rem; color: var(--ticketInk2); font-variant-numeric: tabular-nums; }
.atstop .tk-meta { color: var(--atStopInk); }
.tk-meta .late { color: var(--ticketWarn); font-weight: 700; }
.tk-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pace { font-size: .6875rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--pace); }
.pace.run { background: var(--bad); color: var(--onAccent); }

/* ---- vía ---- */
.via { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 10px; line-height: 1; white-space: nowrap; }
.via small { font-size: .6875rem; font-weight: 700; }
.via b { font-size: 1.25rem; }
.via i { font-style: normal; font-size: .6875rem; font-weight: 700; }
.via.real { background: var(--via); color: var(--viaInk); box-shadow: inset 0 0 0 1px var(--viaEdge); }
.via.real.new { animation: via-pop .7s cubic-bezier(.34,1.45,.64,1) both, via-glow 1.6s ease-in-out .5s 5; }
.rm .via.real.new { animation: none; outline: 2px solid var(--viaEdge); outline-offset: 3px; }
@keyframes via-pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes via-glow { 50% { box-shadow: inset 0 0 0 1px var(--viaEdge), 0 0 0 6px color-mix(in srgb, var(--via) 45%, transparent), 0 0 24px color-mix(in srgb, var(--via) 80%, transparent); } }
.via.guess { border: 1.5px dashed currentColor; }

/* ---- fichas ---- */
.chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; min-width: 92px; padding: 8px 12px; border-radius: 18px; background: var(--surfaceHi); display: flex; flex-direction: column; gap: 4px; }
.chip .n { display: flex; align-items: baseline; gap: 3px; }
.chip .num { font-size: 1.5rem; }
.chip .n small { font-size: .6875rem; font-weight: 700; color: var(--ink3); }
.chip .s { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .75rem; color: var(--ink3); font-variant-numeric: tabular-nums; }
.chip .late { color: var(--warnText); font-weight: 700; }
.chip .via { color: var(--ink2); }
.chip .via.real { color: var(--viaInk); }
.chip .via b { font-size: 1rem; }

/* ---- aviso ---- */
.notice { padding: 10px 12px; border-radius: 18px; background: color-mix(in srgb, var(--noticeWarnC) var(--noticeWarnA), var(--surface)); margin-bottom: 10px; }
.notice.bad { background: color-mix(in srgb, var(--noticeBadC) var(--noticeBadA), var(--surface)); }
.notice header { display: flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 700; color: var(--warnText); }
.notice header .ic { color: var(--warn); }
.notice.bad header, .notice.bad header .ic { color: var(--badText); }
.notice header em { margin-left: auto; font-style: normal; font-weight: 700; font-size: .6875rem; color: var(--ink3); }
.notice p { font-size: .9375rem; line-height: 1.35; margin-top: 4px; }
.notice p[lang=fr] { font-style: italic; color: var(--ink2); }

/* ---- estado ---- */
.status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 9px; border-radius: 999px; font-size: .8125rem; font-weight: 600; color: var(--ink2); position: relative; overflow: hidden; font-variant-numeric: tabular-nums; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--okText); }
.status .bar { position: absolute; left: 14px; right: 14px; bottom: 3px; height: 2px; border-radius: 1px; background: var(--rule); }
.status .bar i { display: block; height: 100%; width: 40%; background: var(--ink3); border-radius: 1px; }
.status.opaque { background: var(--surface); border: 1px solid var(--warn); color: var(--ink); }
.status .ic { width: 16px; height: 16px; flex: none; }
.status .ic.w { color: var(--warnText); } .status .ic.b { color: var(--badText); }
.stale { opacity: .55; filter: saturate(.2); }

/* ---- botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 999px; border: 0; font: 600 1.0625rem/1 inherit; font-family: inherit; }
.btn.primary { background: var(--accentFill); color: var(--onAccent); box-shadow: 0 8px 20px color-mix(in srgb, var(--accentFill) 35%, transparent); }
.btn.danger { background: var(--bad); color: var(--onAccent); box-shadow: 0 8px 20px color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.glassb { color: var(--ink); min-height: 44px; }
.btn.circle { width: 44px; min-height: 44px; padding: 0; }
.btn.text { background: none; color: var(--accent); min-height: 44px; padding: 0 8px; }
.btn.dtext { background: none; color: var(--badText); min-height: 44px; padding: 0 8px; }
.btn.small { font-size: .9375rem; min-height: 36px; padding: 0 14px; }
.tag { font-size: .6875rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--accentFill); color: var(--onAccent); }
.ic { width: 1.1em; height: 1.1em; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px; border-radius: 18px; background: var(--surfaceHi); color: var(--ink3); font-size: .8125rem; text-align: center; }
.empty b { color: var(--ink2); font-size: .9375rem; }
.empty .ic { width: 24px; height: 24px; }
.empty .ic.b { color: var(--badText); }
.errors { font-size: .75rem; color: var(--ink3); text-align: center; margin: 12px 0 0; }
</style>
</head>
<body>
<main id="root"><p>Cargando tokens…</p></main>
<script>
(async () => {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const theme = qs.get('theme') === 'light' ? 'light' : 'dark';
  const hc = qs.get('hc') === '1', rt = qs.get('rt') === '1', rm = qs.get('rm') === '1';
  const variant = theme + (hc ? 'HC' : '');
  const T = await (await fetch('../tokens.json', { cache: 'no-store' })).json();
  const root = document.documentElement;
  root.style.colorScheme = theme;
  root.classList.toggle('hc', hc); root.classList.toggle('rt', rt); root.classList.toggle('rm', rm);
  // Variables CSS: un --token por color, en la variante pedida.
  for (const [name, c] of Object.entries(T.color)) root.style.setProperty('--' + name, c[variant].hex);
  // Los fondos de aviso con alfa se mezclan sobre la tarjeta.
  const alpha = (n) => Math.round(T.color[n][variant].alpha * 100) + '%';
  root.style.setProperty('--noticeWarnC', T.color.noticeWarn[variant].hex.slice(0, 7)); root.style.setProperty('--noticeWarnA', alpha('noticeWarn'));
  root.style.setProperty('--noticeBadC', T.color.noticeBad[variant].hex.slice(0, 7)); root.style.setProperty('--noticeBadA', alpha('noticeBad'));
  root.style.setProperty('--mapA', theme === 'dark' ? '#131417' : '#eef0ee');
  root.style.setProperty('--mapB', theme === 'dark' ? '#25272c' : '#ffffff');

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ICON = {
    warn: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>', stop: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
    moon: '<path d="M21 13a8 8 0 1 1-10-10 7 7 0 0 0 10 10z"/>', wifiOff: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M3 3l18 18"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    play: '<path d="M7 5v14l12-7z"/>', swap: '<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l3 3M17 4l-3 3"/>', len: '<rect x="2" y="9" width="9" height="6" rx="1"/><rect x="13" y="9" width="9" height="6" rx="1"/>'
  };
  const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
  const lines = Object.fromEntries(T.lineas.filas.map(l => [l.code, l]));
  const badge = (code, size = 42) => { const l = lines[code] || { color: '#6B7380', ink: '#FFFFFF' }; return `<span class="badge ${code.length >= 4 ? 'l4' : code.length === 3 ? 'l3' : ''}" style="--lc:${l.color};--li:${l.ink};--s:${size}px">${esc(code)}</span>`; };
  const viaReal = (n, isNew) => `<span class="via real${isNew ? ' new' : ''}"><small>Vía</small><b>${n}</b></span>`;
  const viaGuess = (n, pct) => `<span class="via guess"><small>probable</small><b>${n}</b>${pct ? `<i>${pct} %</i>` : ''}</span>`;
  const ticket = ({ num, unit = 'min', cls = '', dest, meta = '', right = '', pace = '' }) => `<div class="ticket ${cls}">
    <div class="tk-num"><b class="num ${num.length > 3 ? 'word' : ''} ${/h/.test(num) && num.length <= 4 ? 'long' : ''}">${num}</b>${unit ? `<small>${unit}</small>` : ''}</div>
    <div class="tk-body"><span class="tk-dest">${esc(dest)}</span><span class="tk-meta">${meta}</span></div>
    <div class="tk-right">${right}${pace}</div></div>`;
  const chip = ({ num, unit = 'min', second = '' }) => `<div class="chip"><span class="n"><b class="num">${num}</b><small>${unit}</small></span><span class="s">${second}</span></div>`;

  const sw = Object.entries(T.color).map(([n, c]) => `<div style="--c:${c[variant].hex}"><i></i><b>${n}</b>${c[variant].hex}</div>`).join('');
  const allBadges = T.lineas.filas.map(l => `<figure class="${l.source === 'calculada' && l.official ? 'off' : ''}">${`<span class="badge ${l.code.length >= 4 ? 'l4' : l.code.length === 3 ? 'l3' : ''}" style="--lc:${l.color};--li:${l.ink};--s:${l.code.length > 3 ? 30 : 36}px">${esc(l.code.replace(' (lab)', '').replace('naranja de prueba', '·').replace('reserva (R57)', '?'))}</span>`}<small>${String(l.ratio).replace('.', ',')}:1</small></figure>`).join('');

  document.getElementById('root').innerHTML = `
  <header class="top"><h1>Sistema «Cristal»</h1><p>tokens ${esc(T.generado)} · ${theme === 'dark' ? 'oscuro' : 'claro'}${hc ? ' · aumentar contraste' : ''}${rt ? ' · reducir transparencia' : ''}${rm ? ' · reducir movimiento' : ''}</p></header>

  <section id="s-tablero"><h2>Tablero sobre el mapa (cristal arriba, tarjeta opaca)</h2>
    <div class="map">
      <div class="glass" style="border-radius:30px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between">
        <div><p style="font-size:.75rem;font-weight:600;color:var(--ink3)">La que toca ahora</p><h3 style="font-size:1.25rem;font-weight:800">Trabajo → Casa</h3></div>
        <button class="btn glassb circle glass" aria-label="Ajustes">${icon('gear')}</button>
      </div>
      <div style="margin:44px 0 10px"><span class="status glass"><i class="dot"></i>en directo · hace 6 s<span class="bar"><i></i></span></span></div>
      <article class="card">
        <header class="leg-head">${badge('J')}<div><h3>Gare Saint-Lazare <i>→</i> Argenteuil</h3><p>dirección Ermont - Eaubonne</p></div></header>
        ${ticket({ num: '6', dest: 'Ermont - Eaubonne', meta: `<span>12:56</span><span>${icon('len')} largo</span>`, right: viaReal(21, true), pace: '<span class="pace">Anda</span>' })}
        <div class="chips">${chip({ num: '21', second: `13:11 ${viaGuess(21)}` })}${chip({ num: '36', second: '13:26 <span class="late">+2 min</span>' })}${chip({ num: '51', second: '13:41 · largo' })}</div>
      </article>
    </div>
  </section>

  <section id="s-billete"><h2>El billete: estados</h2>
    <div class="grid2">
      <div>${ticket({ num: '6', dest: 'Ermont - Eaubonne', meta: '<span>12:56</span><span>largo</span>', right: viaReal(21), pace: '<span class="pace">Anda</span>' })}</div>
      <div>${ticket({ num: '21', dest: 'Ermont - Eaubonne', meta: '<span>13:11</span><span>corto</span>', right: viaGuess(21, 90), pace: '<span class="pace">Con calma</span>' })}</div>
      <div>${ticket({ num: '1h46', unit: '', dest: 'Pont de Bezons', meta: '<span>14:36</span><span class="late">+11 min</span>', pace: '<span class="pace">Con calma</span>' })}</div>
      <div>${ticket({ num: 'ya', unit: '', dest: 'Olympiades', meta: '<span>12:51</span>', pace: '<span class="pace run">Corre</span>' })}</div>
      <div>${ticket({ num: 'En andén', unit: '', cls: 'atstop', dest: 'Place d’Italie', meta: '<span>12:50</span>' })}</div>
      <div>${ticket({ num: '3', dest: 'Chelles - Gournay', meta: '<span>12:53</span><span class="late">+2 min</span><span>−1 min adelanto</span>', right: viaReal(11, true), pace: '<span class="pace run">Corre</span>' })}</div>
    </div>
  </section>

  <section id="s-avisos"><h2>Avisos, tramo vacío y estados</h2>
    <div class="grid2">
      <div class="card">
        <div class="notice"><header>${icon('warn')}<span>Perturbada</span><em>··· traduciendo</em></header><p lang="fr">Trafic ralenti en raison de travaux sur la voirie.</p></div>
        <div class="notice bad"><header>${icon('stop')}<span>Interrumpida</span></header><p>El tráfico está interrumpido en toda la línea por un incidente técnico.</p></div>
        <div class="empty">${icon('stop', 'b')}<b>Sin circulación</b><span>no hay más salidas</span></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
        <span class="status glass"><i class="dot"></i>en directo · hace 6 s<span class="bar"><i></i></span></span>
        <span class="status opaque">${icon('clock', 'w')}dato viejo · hace 4 min</span>
        <span class="status opaque">${icon('wifiOff', 'b')}sin conexión · último tablero hace 4 min</span>
        <span class="status opaque">${icon('key', 'b')}el servidor no tiene clave de PRIM</span>
        <div class="empty" style="width:100%">${icon('moon')}<b>Servicio finalizado</b><span>no hay más salidas</span></div>
        <div class="stale" style="width:100%">${ticket({ num: '6', dest: 'Ermont - Eaubonne (tablero apagado, R19)', meta: '<span>12:56</span>', right: viaReal(21) })}</div>
      </div>
    </div>
  </section>

  <section id="s-botones"><h2>Botones</h2>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <button class="btn primary">${icon('play')} Iniciar trayecto</button>
      <button class="btn danger">${icon('swap')} Buscar alternativa · línea 14 cortada</button>
      <div class="row"><button class="btn glassb glass">Emparejar de nuevo</button><button class="btn glassb circle glass" aria-label="Ajustes">${icon('gear')}</button><button class="btn text">Guardar</button><button class="btn dtext">Eliminar ruta</button><button class="btn primary small">Guardar ruta</button><span class="tag">ahora</span></div>
    </div>
  </section>

  <section id="s-lineas"><h2>Distintivos de línea (tinta con contraste garantizado; en naranja, las que no usan el texto oficial)</h2>
    <div class="card"><div class="badges">${allBadges}</div></div>
  </section>

  <section id="s-paleta"><h2>Paleta (${variant})</h2><div class="sw">${sw}</div></section>`;
})().catch(e => { document.getElementById('root').textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
