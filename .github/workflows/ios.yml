# App iOS: XcodeGen, tests, capturas y las DOS IPA sin firmar como artefactos.
#   Trajet-full.ipa  con widgets, Live Activity y App Group (certificado tipo Signulous)
#   Trajet-lite.ipa  sin extensiones ni App Group (Apple ID gratuito)
# En los tags v* se adjuntan a una Release.
#
# Modos (para no gastar minutos de macOS, que en un repo privado cuentan x10):
#   compilar  solo comprueba que TODO compila (app, lite, extension y tests)
#   completo  compilar + IPA full y lite + tests unitarios y de interfaz
#   capturas  completo + capturas en iPhone SE, 16 y 16 Pro Max, claro y
#             oscuro y letra grande
# Un push hace «completo»; a mano (Run workflow) se elige.
name: iOS

on:
  push:
    branches: [main, rewrite-v2]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**", "design-lab/**"]
  workflow_dispatch:
    inputs:
      modo:
        description: "compilar | completo | capturas"
        required: true
        default: completo

permissions:
  contents: write     # solo para adjuntar las IPA a la Release de un tag

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  MODO: ${{ github.event.inputs.modo || (startsWith(github.ref, 'refs/tags/v') && 'capturas') || 'completo' }}

jobs:
  ios:
    runs-on: macos-latest
    # «capturas» son 7 pasadas de simulador (3 modelos x claro/oscuro + letra
    # grande) detras de compilar, las IPA y los tests: cerca de una hora.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Xcode mas nuevo de la imagen
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          echo "Modo: $MODO"

      - name: Generar el proyecto
        run: |
          set -euo pipefail
          brew install xcodegen >/dev/null
          xcodegen generate --spec project.yml

      - name: Compilar todo (simulador, Debug, con los tests)
        id: compilar
        run: |
          set -uo pipefail
          mkdir -p build
          fallo=0
          xcodebuild build-for-testing \
            -project Trajet.xcodeproj -scheme Trajet \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO > build/compilar.log 2>&1 || fallo=1
          xcodebuild build \
            -project Trajet.xcodeproj -scheme TrajetLite \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim-lite \
            CODE_SIGNING_ALLOWED=NO > build/compilar-lite.log 2>&1 || fallo=1
          tail -3 build/compilar.log build/compilar-lite.log
          exit $fallo

      # Siempre: los avisos (concurrencia de Swift 6 sobre todo) tambien
      # cuando compila.
      - name: Errores y avisos de compilacion
        if: always()
        run: |
          grep -h -E "error:" build/*.log | sort -u | head -200 || true
          echo "--- avisos ---"
          grep -h -E "warning:" build/*.log | sort -u | head -300 || true

      - name: IPA full y lite (Release, sin firmar)
        if: env.MODO != 'compilar'
        run: |
          set -euo pipefail
          bash scripts/ci-ipa.sh

      - name: Tests unitarios y de interfaz
        if: env.MODO != 'compilar'
        run: |
          set -euo pipefail
          bash scripts/ci-tests.sh

      # Con que compile basta: si falla un test de flujo, las capturas se
      # hacen igual (sirven para ver que ha pasado).
      - name: Capturas
        if: env.MODO == 'capturas' && !cancelled() && steps.compilar.outcome == 'success'
        run: |
          set -euo pipefail
          bash scripts/ci-capturas.sh

      - name: Resumen de tests (si fallan)
        if: failure() && env.MODO != 'compilar'
        run: |
          ls build/*.xcresult 2>/dev/null || true
          for r in build/*.xcresult; do
            xcrun xcresulttool get test-results summary --path "$r" --compact 2>/dev/null | head -c 20000 || true
          done

      - name: Subir las IPA
        if: env.MODO != 'compilar'
        uses: actions/upload-artifact@v4
        with:
          name: Trajet-ipa-${{ github.run_number }}
          path: |
            build/ipa/Trajet-full.ipa
            build/ipa/Trajet-lite.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Subir capturas
        if: env.MODO == 'capturas' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Trajet-capturas-${{ github.run_number }}
          path: build/capturas
          if-no-files-found: warn
          retention-days: 30

      - name: Subir resultados de tests
        if: env.MODO != 'compilar' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Trajet-xcresult-${{ github.run_number }}
          path: build/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Los .xcresult de las capturas llevan todas las imagenes dentro: solo
      # se suben si algo ha fallado, para ver por que.
      - name: Subir resultados de capturas (si fallan)
        if: env.MODO == 'capturas' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: Trajet-capturas-xcresult-${{ github.run_number }}
          path: |
            build/capturas-*.xcresult
            build/capturas-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Subir registros de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trajet-logs-${{ github.run_number }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" build/ipa/Trajet-full.ipa build/ipa/Trajet-lite.ipa \
            --title "Trajet ${GITHUB_REF_NAME}" \
            --notes "IPA sin firmar. full: con widgets y Live Activity (necesita App Group: certificado tipo Signulous). lite: sin extensiones, para firmar con un Apple ID gratuito." \
            || gh release upload "${GITHUB_REF_NAME}" build/ipa/Trajet-full.ipa build/ipa/Trajet-lite.ipa --clobber
